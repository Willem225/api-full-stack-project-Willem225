<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CZN Deck Builder</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <!-- Cosmic background layers (always present, behind content) -->
  <div class="cosmos" aria-hidden="true"></div>
  <div class="stars"  aria-hidden="true"></div>

  <!-- Background video — same file as the intro. Plays ONCE from 6.44s, then
       stops on the last frame. The bgBreathe CSS animation handles the
       visible pulsing effect (matches the Sereniel website exactly). -->
  <div id="bg-video-wrap" aria-hidden="true">
    <video id="bg-video" muted playsinline preload="auto"></video>
  </div>

  <!-- Intro overlay — autoplay muted, fades out after the explosion. Hidden
       on subsequent navigations within the same browser session.
       Click to unmute, press Space to skip. -->
  <div id="intro-overlay" aria-hidden="true">
    <video id="intro-video" muted playsinline preload="auto" src="./videos/intro.mp4"></video>
    <div id="explosion-flash"></div>
  </div>

  <div class="app">
    <aside class="sidebar">
      <a href="#/cards" class="sidebar-brand">
        <span class="brand-mark">CZN</span>
      </a>

      <nav id="nav" class="sidebar-nav"></nav>

      <div id="auth-slot" class="sidebar-auth"></div>
    </aside>

    <main id="view" class="view"></main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    // Intro IIFE — plays once per browser session. Watches the video clock
    // (rAF, not timeupdate which is throttled) and triggers an explosion flash
    // at 7.13s, then fades out and starts the looping background video at 6.44s.
    (function () {
      const overlay = document.getElementById('intro-overlay');
      const intro   = document.getElementById('intro-video');
      const flash   = document.getElementById('explosion-flash');
      const bgWrap  = document.getElementById('bg-video-wrap');
      const bg      = document.getElementById('bg-video');
      const root    = document.documentElement;

      const EXPLOSION_AT = 7.13;
      const BG_START = 6.44;        // bg video plays once from 6.44s and freezes
      const FALLBACK_MS  = 4000;

      // Match Sereniel exactly: bg video plays ONCE from 6.44s to end, then
      // stops on the last frame (post-explosion fade). The bgBreathe CSS
      // animation pulses opacity + scale on that frozen frame.
      function startBackgroundLoop() {
        const seekOnce = () => {
          try { bg.currentTime = BG_START; } catch {}
          bg.muted = true;
          bg.play().catch(() => {});
        };
        bg.src = './videos/intro.mp4';
        if (bg.readyState >= 1) seekOnce();
        else bg.addEventListener('loadeddata', seekOnce, { once: true });
      }

      let finished = false;
      const handlers = {};   // populated below; finish() detaches them
      function finish() {
        if (finished) return;
        finished = true;
        // detach interactive listeners
        if (handlers.click) overlay.removeEventListener('click', handlers.click);
        if (handlers.key)   window.removeEventListener('keydown', handlers.key);
        overlay.classList.add('hide');
        root.classList.add('intro-done');
        setTimeout(() => { overlay.remove(); }, 600);
        // Activate looping background video
        bgWrap.classList.add('show');
        startBackgroundLoop();
      }

      let exploded = false;
      function tick() {
        if (finished) return;
        if (!exploded && intro.currentTime >= EXPLOSION_AT) {
          exploded = true;
          flash.classList.add('flash');
          setTimeout(finish, 380);
        } else {
          requestAnimationFrame(tick);
        }
      }

      intro.addEventListener('play', () => requestAnimationFrame(tick));
      intro.addEventListener('ended', finish);
      intro.addEventListener('error', finish);
      intro.play().catch(finish);

      // Click → unmute (only the first click; further clicks do nothing).
      handlers.click = function () {
        if (finished) return;
        if (intro.muted) {
          intro.muted = false;
          intro.volume = 1.0;
          overlay.classList.add('unmuted');
          // Re-issue play(); some browsers re-mute or hiccup on the toggle.
          intro.play().catch(() => {});
        }
      };
      overlay.addEventListener('click', handlers.click);

      // Spacebar → skip.
      handlers.key = function (e) {
        if (finished) return;
        if (e.code === 'Space' || e.key === ' ') {
          e.preventDefault();
          finish();
        }
      };
      window.addEventListener('keydown', handlers.key);

      // Bail out if something hangs
      setTimeout(() => { if (!finished) finish(); }, FALLBACK_MS + 4000);
    })();
  </script>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
